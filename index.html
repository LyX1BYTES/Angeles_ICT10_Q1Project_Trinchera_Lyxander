<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skewer</title>

  <!-- PyScript runs main.py in the browser -->
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

  <style>
    /* Change the theme colors here */
    :root { --navy: #904b9c; --blue: #03275c; --purple: #6610f2; --border: #dee2e6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           font-family: "Segoe UI", Arial, sans-serif; color: #212529;
           background: url("https://i.pinimg.com/1200x/00/a1/91/00a1915977ae86deb0198b595e784482.jpg") center / cover no-repeat fixed; }
    nav { display: flex; justify-content: space-between; align-items: center;
          padding: 18px 36px; background: var(--navy); }
    .brand { color: #fff; font-weight: 700; font-size: 1.2rem; }
    nav a { color: rgba(255,255,255,.6); text-decoration: none; margin-left: 20px; cursor: pointer; }
    nav a.active, nav a:hover { color: #fff; }
    main { flex: 1; display: flex; justify-content: center; padding: 48px 16px; }
    .card { width: 100%; max-width: 540px; height: fit-content; background: #fff;
            border-radius: 18px; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,.3); }
    .header { text-align: center; padding: 26px 20px; color: #fff;
              background: url("https://i.pinimg.com/1200x/7a/50/4b/7a504be4aa26d056d4d6f8b995520189.jpg") center / cover no-repeat fixed; }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .header p { margin: 4px 0 0; opacity: .85; }
    .body { padding: 24px; }
    label { display: block; font-weight: 600; margin: 0 0 7px; }
    input, select { width: 100%; padding: 11px; font-size: 1rem; margin-bottom: 18px;
                    border: 1px solid var(--border); border-radius: 8px; }
    button { width: 100%; padding: 13px; font-size: 1.1rem; font-weight: 600; color: #fff;
             border: none; border-radius: 8px; cursor: pointer;
             background: linear-gradient(90deg, var(--blue), var(--purple)); }
    hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .output { text-align: center; color: #6c757d; }
    .error { color: #dc3545; font-weight: 600; }
    .sku-code { display: inline-block; margin: 8px 0; padding: 12px 22px; font: 700 2rem "Courier New", monospace;
                letter-spacing: 3px; color: var(--navy); background: #eef3ff;
                border: 2px dashed var(--blue); border-radius: 10px; }
    .small { font-size: .9rem; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
                 margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; }
    .menu-item .name { flex: 1; font-weight: 600; }
    .menu-item .price { font-weight: 700; color: var(--blue); }
    .menu-item input { width: 70px; margin: 0; padding: 6px; text-align: center; }
    .receipt { text-align: left; color: #212529; font-family: "Courier New", monospace;
               background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .receipt h3 { text-align: center; margin: 0; }
    .center { text-align: center; font-size: .85rem; color: #6c757d; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; }
    .total { font-weight: 700; font-size: 1.15rem; border-top: 2px dashed #999; margin-top: 8px; padding-top: 8px; }
    footer { text-align: center; padding: 18px; color: #fff; background: var(--navy); }
  </style>
</head>

<body>
  <nav>
    <span class="brand">A Taste of Saignant</span>
    <div>
      <a id="nav-sku" class="active" py-click="show_sku_page"> SKU Generator</a>
      <a id="nav-receipt" py-click="show_receipt_page">🧾 Receipt Generator</a>
    </div>
  </nav>

  <main>
    <!-- Page 1: SKU generator -->
    <section class="card" id="sku-page">
      <div class="header"><h1>SKU Generator</h1></div>
      <div class="body">
        <label for="category">Category</label>
        <select id="category">
          <option>Perishables</option>
          <option>Beverages</option>
          <option>Snacks</option>
          <option>Clothing</option>
        </select>

        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="e.g. Bottled Water">

        <label for="stockQty">Stock Quantity</label>
        <input type="number" id="stockQty" placeholder="e.g. 50" min="0" max="999">

        <button py-click="generate_sku">Generate SKU</button>
        <hr>
        <div class="output" id="skuResult"><strong>Your generated SKU will appear here.</strong></div>
      </div>
    </section>

    <!-- Page 2: Receipt generator (Skills Test) -->
    <section class="card" id="receipt-page" style="display: none;">
      <div class="header"><h1>OBMC Entrep Fair</h1><p>Group 1 - Cafe</p></div>
      <div class="body">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" placeholder="e.g. Juan Dela Cruz">

        <label>Menu (enter quantity)</label>
        <div id="menu"></div>

        <button py-click="create_order">🧾 Create Order</button>
        <hr>
        <div class="output" id="summary">Your order summary will appear here.</div>
      </div>
    </section>
  </main>

  <footer>SKU Generator - 1st Quarter Project</footer>

  <!-- Load the Python code -->
  <script type="py" src="./main.py"></script>
</body>
</html>
